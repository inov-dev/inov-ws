<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recherche | INOV</title><link rel="stylesheet" href="./assets/site.css"><style>main{max-width:800px;margin:3rem auto;padding:1.5rem}li{margin:1rem 0}</style></head><body><main><p><a href="./">← Accueil</a></p><h1>Recherche</h1><form><input name="s" aria-label="Rechercher" required><button>Rechercher</button></form><ul id="results"></ul></main><script>const q=new URLSearchParams(location.search).get('s')||'';document.querySelector('input').value=q;fetch('./assets/search-index.json').then(r=>r.json()).then(pages=>{const matches=pages.filter(p=>p.title.toLocaleLowerCase('fr').includes(q.toLocaleLowerCase('fr')));document.querySelector('#results').innerHTML=matches.map(p=>'<li><a href=".'+p.url+'">'+p.title+'</a></li>').join('')||'<li>Aucun résultat</li>'})</script></body></html>
